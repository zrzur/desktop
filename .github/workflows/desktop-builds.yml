name: Desktop builds
# Builds the desktop app for Windows, macOS and Linux, each on its own runner,
# and keeps the files as workflow artifacts. Nothing is published or uploaded
# anywhere else; a maintainer downloads, tests and hosts them by hand.
# The macOS build is not signed or notarised yet: macOS asks before the first open.
on:
  workflow_dispatch:
  # a manual run needs the file on main; until then a change to this file on
  # beta starts the builds (re-run them from the Actions page)
  push:
    branches: [beta]
    paths:
      - .github/workflows/desktop-builds.yml
      - forge.config.ts
      - package.json
      - pnpm-lock.yaml
      - assets/desktop/**
      - src/**
permissions:
  contents: read
concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            arch: x64
          - name: macOS Apple silicon
            os: macos-latest
            arch: arm64
          - name: macOS Intel
            os: macos-latest
            arch: x64
          - name: Linux x64
            os: ubuntu-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Linux audio headers for screen-share sound (node-pipewire)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test test/*.test.mjs
      # the zip maker works on every system; Windows also gets its installer
      - name: Linux package tools (deb)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot dpkg
      # official builds: the app URL is built in, and the build refuses a missing,
      # insecure or upstream URL; the About panel links to this exact commit
      - name: Make
        shell: bash
        env:
          ZRZUR_DESKTOP_URL: https://app.zrzur.com
          ZRZUR_RELEASE_BUILD: "1"
          ZRZUR_GIT_COMMIT: ${{ github.sha }}
          ZRZUR_GIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pnpm exec electron-forge make --arch=${{ matrix.arch }} --targets @electron-forge/maker-squirrel,@electron-forge/maker-zip
          elif [ "$RUNNER_OS" = "Linux" ]; then
            pnpm exec electron-forge make --arch=${{ matrix.arch }} --targets @electron-forge/maker-zip,@electron-forge/maker-deb
          else
            pnpm exec electron-forge make --arch=${{ matrix.arch }} --targets @electron-forge/maker-zip
          fi
      - name: Checksums
        shell: bash
        run: |
          cd out/make
          # sha256sum on Windows and Linux, shasum on macOS
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          find . -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.nupkg' -o -name '*.deb' \) -print0 \
            | xargs -0 $sum | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zrzur-desktop-${{ runner.os }}-${{ matrix.arch }}
          path: |
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/*.deb
            out/make/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
