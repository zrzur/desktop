name: Source integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release manifest
        run: |
          python3 - <<'PY'
          import json, pathlib
          release = json.loads(pathlib.Path('RELEASE.json').read_text())
          assert release['version'] == '26.3.0-beta.9'
          assert release['component'] == 'desktop'
          assert release['releaseReady'] is True
          assert pathlib.Path('LICENSE').exists()
          assert pathlib.Path('ZRZUR_RELEASE.md').exists()
          print('Release manifest verified; functional release checks remain separate.')
          PY
      - name: Verify reviewed public source files
        run: python3 scripts/publication_guard.py
  application-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify packaged origin isolation
        run: node --test test/applicationUrl.test.mjs
