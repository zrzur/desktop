allowBuilds:
  bufferutil: true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pipewire: true
  register-scheme@https://codeload.github.com/devsnek/node-register-scheme/tar.gz/e7cc9a63a1f512565da44cb57316d9fb10750e17: true
  uiohook-napi: false
  utf-8-validate: true

nodeLinker: hoisted

blockExoticSubdeps: false # required to make discord-rpc work

# Override for node 26 bug
overrides:
  yauzl: ^3.3.1
  minimatch@3: 3.1.5
  minimatch@9: 9.0.9
  undici: 7.30.2
  fast-uri: 3.1.9
  # Security (pnpm audit, 2026-11-11): lift vulnerable transitive versions
  # to the first patched release in the same major
  "ws@<7.5.11": ">=7.5.11"
  "ajv@>=7.0.0 <8.18.0": ">=8.18.0 <9"
